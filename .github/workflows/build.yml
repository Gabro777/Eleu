name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

      # The installer is built on every change: it can be downloaded from the run page (for 14 days).
      - name: Installer
        shell: pwsh
        run: ./build-installer.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: installer
          path: artifacts/*.msi
          retention-days: 14

      # With a version tag (for example v1.0.0) the installer also goes into a GitHub release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # Also a copy always called Eleu.msi: so .../releases/latest/download/Eleu.msi always downloads the latest.
        run: |
          Copy-Item (Get-ChildItem artifacts/Eleu-*.msi).FullName artifacts/Eleu.msi
          gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts/*.msi).FullName --title "Eleu ${{ github.ref_name }}" --notes-file docs/NOVITA.md
    permissions:
      contents: write
